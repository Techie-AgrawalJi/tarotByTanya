name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Install ALL workspace dependencies
      - name: Install dependencies
        run: npm ci

      # Build frontend
      - name: Build frontend
        working-directory: artifacts/astrology-site
        run: npm run build

      # Build backend
      - name: Build backend
        working-directory: artifacts/api-server
        run: npm run build

      # Restart backend
      - name: Restart backend
        working-directory: artifacts/api-server
        run: |
          pm2 delete backend || true
          pm2 start npm --name backend -- start
